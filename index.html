  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}

async function fromPassword(pw, remember) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  await open(key);
  if (remember) {
    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    try { localStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch (e) {}
  }
}

(async () => {
  const saved = localStorage.getItem(STORE);
  if (saved) {
    try { await open(await crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', false, ['decrypt'])); return; }
    catch (e) { localStorage.removeItem(STORE); }
  }
})();

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '확인 중...';
  try { await fromPassword(document.getElementById('pw').value, document.getElementById('rem').checked); }
  catch (err) { msg.textContent = '비밀번호가 틀렸습니다'; }
};
})();
